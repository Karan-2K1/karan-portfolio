name: Deploy Static Website to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🧰 Install AWS CLI
        run: |
          sudo apt update
          sudo apt install -y awscli

      - name: 🚀 Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'us-east-1' # change this if your bucket is in a different region
        run: |
          aws s3 sync . s3://code-bucket2k2 --exclude ".git/*" --exclude ".github/*" --delete
